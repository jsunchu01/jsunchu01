<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" width="300" height="290" role="img" aria-label="EfficientPIE: lightweight convolution architecture for pedestrian crossing-intent prediction with 0.21ms inference">
  <!-- 3D edge -->
  <rect x="10" y="16" width="272" height="268" rx="12" fill="#FB923C"/>
  <!-- card face -->
  <rect x="20" y="6" width="272" height="268" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.5"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="40" y="44" font-size="20" font-weight="800" fill="#1F2328">EfficientPIE</text>
    <rect x="40" y="53" width="36" height="3" rx="1.5" fill="#FB923C"/>

    <g font-size="12.5" fill="#57606A">
      <text x="40" y="84">Reconstructed a lightweight</text>
      <text x="40" y="102">convolution architecture for</text>
      <text x="40" y="120">pedestrian crossing-intent</text>
      <text x="40" y="138">prediction in autonomous driving</text>
      <text x="40" y="156">systems, achieving sub-millisecond</text>
      <text x="40" y="174">(0.21ms) inference suitable for</text>
      <text x="40" y="192">real-time ADAS deployment.</text>
    </g>

    <line x1="40" y1="212" x2="272" y2="212" stroke="#E5E7EB" stroke-width="1"/>
    <g font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#EA580C">
      <text x="40" y="236">PyTorch · CLIP · Grad-CAM++</text>
      <text x="40" y="252">JAAD · PIE datasets</text>
    </g>
  </g>
</svg>
