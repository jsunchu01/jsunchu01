<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 236" width="300" height="236" role="img" aria-label="EfficientPIE: tests an AI model that predicts whether pedestrians will cross the street">
  <!-- 3D edge -->
  <rect x="10" y="16" width="272" height="214" rx="12" fill="#FB923C"/>
  <!-- card face -->
  <rect x="20" y="6" width="272" height="214" rx="12" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.5"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="40" y="44" font-size="20" font-weight="800" fill="#1F2328">EfficientPIE</text>
    <rect x="40" y="53" width="36" height="3" rx="1.5" fill="#FB923C"/>

    <g font-size="12.5" fill="#57606A">
      <text x="40" y="84">Tests an AI model that predicts if</text>
      <text x="40" y="102">pedestrians will cross the street.</text>
      <text x="40" y="120">Finds it relies on the background,</text>
      <text x="40" y="138">not the person, failing up close.</text>
    </g>

    <line x1="40" y1="158" x2="272" y2="158" stroke="#E5E7EB" stroke-width="1"/>
    <g font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#EA580C">
      <text x="40" y="182">PyTorch · CLIP · Grad-CAM++</text>
      <text x="40" y="198">JAAD · PIE datasets</text>
    </g>
  </g>
</svg>
