<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Jahnavi Sunchu">
  <defs>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#DB2777"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>

    <!-- hand-drawn cloud outline (about 120 x 62) -->
    <path id="cloudShape" d="M10,56 C-4,53 -3,34 13,32 C10,15 30,7 43,18 C51,1 80,1 86,20 C102,12 121,27 109,41 C124,43 123,59 105,59 C70,61 40,58 10,56 Z"/>
    <!-- four point sparkle -->
    <path id="spark" d="M0,-12 Q0,0 12,0 Q0,0 0,12 Q0,0 -12,0 Q0,0 0,-12 Z"/>
    <!-- raindrop -->
    <path id="drop" d="M0,-7 C5,0 5,6 0,6 C-5,6 -5,0 0,-7 Z"/>

    <style>
      .ol { stroke: #3b3b4f; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .face { fill: none; stroke: #3b3b4f; stroke-width: 2.2; stroke-linecap: round; }
      @media (prefers-color-scheme: dark) {
        .ol { stroke: #e5e7eb; }
        .face { stroke: #e5e7eb; }
      }
      .box { transform-box: fill-box; transform-origin: center; }

      .drift1 { animation: d1 16s ease-in-out infinite alternate; }
      .drift2 { animation: d2 21s ease-in-out infinite alternate; }
      .drift3 { animation: d3 13s ease-in-out infinite alternate; }
      .bob    { animation: bob 4s ease-in-out infinite; }
      .bob2   { animation-duration: 5.3s; animation-delay: -1.5s; }
      .bob3   { animation-duration: 3.6s; animation-delay: -2.2s; }
      .twinkle { animation: twinkle 2.6s ease-in-out infinite; }
      .tw2 { animation-duration: 3.4s; animation-delay: -1.1s; }
      .tw3 { animation-duration: 2.1s; animation-delay: -0.6s; }
      .rain { animation: rain 1.9s linear infinite; }
      .r2 { animation-delay: -0.4s; }
      .r3 { animation-delay: -0.8s; }
      .r4 { animation-delay: -1.2s; }
      .r5 { animation-delay: -1.6s; }

      @keyframes d1 { from { transform: translateX(-40px); } to { transform: translateX(90px); } }
      @keyframes d2 { from { transform: translateX(-70px); } to { transform: translateX(60px); } }
      @keyframes d3 { from { transform: translateX(-50px); } to { transform: translateX(70px); } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
      @keyframes twinkle { 0%,100% { opacity: .3; transform: scale(.6) rotate(0deg); } 50% { opacity: 1; transform: scale(1.15) rotate(20deg); } }
      @keyframes rain { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(58px); opacity: 0; } }

      .name { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 62px; letter-spacing: 1px; fill: url(#nameGrad); }
    </style>
  </defs>

  <!-- ═════ cloud 1: grey happy cloud that rains ═════ -->
  <g transform="translate(110 22)">
    <g class="drift1"><g class="bob">
      <use href="#cloudShape" class="ol" fill="#D5DBE8"/>
      <path class="face" d="M40,36 q4,-6 8,0 M68,36 q4,-6 8,0"/>
      <path class="face" d="M52,45 q6,6 12,0"/>
      <ellipse cx="33" cy="43" rx="5" ry="3" fill="#F9A8D4" opacity=".8"/>
      <ellipse cx="83" cy="43" rx="5" ry="3" fill="#F9A8D4" opacity=".8"/>
      <g transform="translate(0 62)">
        <g transform="translate(28 0)"><use href="#drop" class="rain"    fill="#F472B6"/></g>
        <g transform="translate(46 0)"><use href="#drop" class="rain r2" fill="#FBBF24"/></g>
        <g transform="translate(64 0)"><use href="#drop" class="rain r3" fill="#34D399"/></g>
        <g transform="translate(82 0)"><use href="#drop" class="rain r4" fill="#60A5FA"/></g>
        <g transform="translate(98 0)"><use href="#drop" class="rain r5" fill="#A78BFA"/></g>
      </g>
    </g></g>
  </g>

  <!-- ═════ cloud 3: small sleepy pink cloud with a bow ═════ -->
  <g transform="translate(400 40) scale(0.85)">
    <g class="drift3"><g class="bob bob3">
      <use href="#cloudShape" class="ol" fill="#FBE4EC"/>
      <path class="face" d="M40,36 q4,5 8,0 M68,36 q4,5 8,0"/>
      <path d="M58,52 C50,45 54,40 58,44 C62,40 66,45 58,52 Z" fill="#F43F5E"/>
      <path class="ol" d="M96,14 l10,-8 v14 z M96,14 l-10,-8 v14 z" fill="#7DD3FC" stroke-width="2"/>
    </g></g>
  </g>

  <!-- ═════ cloud 2: white cloud with a rainbow ═════ -->
  <g transform="translate(640 24)">
    <g class="drift2"><g class="bob bob2">
      <path d="M78,34 C88,-12 140,-6 150,34" fill="none" stroke="#F87171" stroke-width="6" stroke-linecap="round"/>
      <path d="M78,42 C88,0 138,4 146,42" fill="none" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
      <path d="M78,50 C90,12 132,14 142,50" fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round"/>
      <use href="#cloudShape" class="ol" fill="#FFFFFF"/>
      <path class="face" d="M38,36 q4,-6 8,0 M68,36 q4,-6 8,0"/>
      <path class="face" d="M52,45 q6,5 12,0"/>
      <ellipse cx="31" cy="43" rx="5" ry="3" fill="#F9A8D4" opacity=".8"/>
      <ellipse cx="80" cy="43" rx="5" ry="3" fill="#F9A8D4" opacity=".8"/>
    </g></g>
  </g>

  <!-- ═════ twinkling stars ═════ -->
  <g fill="#F59E0B">
    <g transform="translate(60 40)"><g class="box twinkle"><use href="#spark"/></g></g>
    <g transform="translate(330 30)"><g class="box twinkle tw2"><use href="#spark" transform="scale(.75)"/></g></g>
    <g transform="translate(590 95)"><g class="box twinkle tw3"><use href="#spark" transform="scale(.9)"/></g></g>
    <g transform="translate(850 45)"><g class="box twinkle tw2"><use href="#spark" transform="scale(.7)"/></g></g>
  </g>

  <!-- ═════ name ═════ -->
  <text class="name" x="450" y="195" text-anchor="middle">Jahnavi Sunchu</text>
</svg>
