<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 236" width="300" height="236" role="img" aria-label="Multimodal Search: answers questions about PDFs and verifies every number against the source">
  <!-- 3D edge -->
  <rect x="10" y="16" width="272" height="214" rx="12" fill="#14B8A6"/>
  <!-- card face -->
  <rect x="20" y="6" width="272" height="214" rx="12" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.5"/>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="40" y="44" font-size="20" font-weight="800" fill="#1F2328">Multimodal Search</text>
    <rect x="40" y="53" width="36" height="3" rx="1.5" fill="#14B8A6"/>

    <g font-size="12.5" fill="#57606A">
      <text x="40" y="84">Answers questions about PDFs like</text>
      <text x="40" y="102">financial filings, including their</text>
      <text x="40" y="120">tables and charts, and verifies</text>
      <text x="40" y="138">every number against the source.</text>
    </g>

    <line x1="40" y1="158" x2="272" y2="158" stroke="#E5E7EB" stroke-width="1"/>
    <g font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#0D9488">
      <text x="40" y="182">Python · PostgreSQL · pgvector</text>
      <text x="40" y="198">Docling · Ollama · Streamlit</text>
    </g>
  </g>
</svg>
